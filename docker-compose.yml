services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - app-data:/app/data
      - app-uploads:/app/public/uploads
    environment:
      - PORT=3000

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  app-uploads:
  caddy-data:
  caddy-config:
